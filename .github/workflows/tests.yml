name: Pruebas de Neuroflex

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  django:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: neuroflex-dashboard-master
    env:
      DJANGO_SETTINGS_MODULE: config.test_settings
      PYTHONUTF8: "1"
      COGNITO_CLIENT_ID: neuroflex-ci-test-client
      NEUROFLEX_API_BASE_URL: https://api.example.test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: neuroflex-dashboard-master/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Comprobar Django
        id: check
        run: python manage.py check 2>&1 | tee django-check.log
      - name: Ejecutar pruebas Django
        if: ${{ !cancelled() && (success() || steps.check.outcome == 'failure') }}
        run: python manage.py test --noinput -v 2 2>&1 | tee django-tests.log
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: django-logs
          path: neuroflex-dashboard-master/django-*.log
          retention-days: 30

  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: neuroflex-dashboard-master/package-lock.json
      - run: npm ci
        working-directory: neuroflex-dashboard-master
      - name: Ejecutar pruebas JavaScript
        id: javascript
        working-directory: neuroflex-dashboard-master
        run: npm test 2>&1 | tee javascript-tests.log
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: javascript-logs
          path: neuroflex-dashboard-master/javascript-tests.log
          retention-days: 30
